name: Deploy to Render

on:
  push:
    branches:
      - MergeCalidad
  workflow_dispatch:

env:
  SERVICE_HOOK: ${{ secrets.RENDER_SERVICEHC_DEPLOY_HOOK }}

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        if: env.SERVICE_HOOK != ''
        run: curl -fsSL -X POST "$SERVICE_HOOK"
